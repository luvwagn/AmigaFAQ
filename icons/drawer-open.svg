<svg xmlns="http://www.w3.org/2000/svg" width="16" height="14" viewBox="0 0 16 14" shape-rendering="crispEdges">
<!-- papers sticking out of the open drawer -->
<rect x="3" y="0" width="9" height="6" fill="#000"/>
<rect x="4" y="1" width="7" height="5" fill="#fff"/>
<rect x="5" y="2" width="5" height="1" fill="#6688bb"/>
<rect x="5" y="4" width="4" height="1" fill="#6688bb"/>
<!-- open drawer sides -->
<rect x="0" y="5" width="16" height="9" fill="#000"/>
<rect x="1" y="6" width="14" height="2" fill="#aaa"/>
<!-- drawer front, pulled forward -->
<rect x="1" y="8" width="14" height="5" fill="#6688bb"/>
<rect x="1" y="8" width="14" height="1" fill="#fff"/>
<rect x="1" y="8" width="1" height="5" fill="#fff"/>
<rect x="5" y="10" width="6" height="2" fill="#000"/>
</svg>
